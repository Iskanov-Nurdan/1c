# Имя проекта задаёт префикс контейнеров, сетей и томов.
# Без него Compose берёт имя папки (docker) и цепляет тома соседних проектов.
name: erp

services:
  db:
    image: postgres:16-alpine
    container_name: erp_db_prod
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - erp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: erp_web_prod
    restart: unless-stopped
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    env_file:
      - ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.prod
      - USE_SQLITE=False
      - POSTGRES_HOST=db
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - erp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    container_name: erp_nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - erp

networks:
  erp:
    driver: bridge

volumes:
  postgres_data:
  static_data:
  media_data:
