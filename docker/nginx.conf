upstream erp {
    server web:8000;
}

# Ограничение частоты запросов — защита от перебора паролей и флуда
limit_req_zone $binary_remote_addr zone=erp_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Сжатие
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Заголовки безопасности
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Вся статика — стили, скрипты и изображения SPA плюс файлы админки —
    # собирается командой collectstatic в /app/staticfiles.
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    location /api/health/ {
        proxy_pass http://erp;
        access_log off;
    }

    location / {
        limit_req zone=erp_limit burst=40 nodelay;

        proxy_pass http://erp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
