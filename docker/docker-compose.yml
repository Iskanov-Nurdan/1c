# Имя проекта задаёт префикс контейнеров, сетей и томов.
# Без него Compose берёт имя папки (docker) и цепляет тома соседних проектов.
name: erp

services:
  db:
    image: postgres:16-alpine
    container_name: erp_db
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - erp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: erp_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../app:/app
      - media_data:/app/media
    env_file:
      - ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      - USE_SQLITE=False
      - POSTGRES_HOST=db
    depends_on:
      db:
        condition: service_healthy
    # На хосте ERP слушает 8080 (8000 может быть занят другим проектом)
    ports:
      - "8080:8000"
    networks:
      - erp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  erp:
    driver: bridge

volumes:
  postgres_data:
  media_data:
